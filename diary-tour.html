<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theatre Booking and Outcome Tracking System</title>
<style>
:root{--bg:#EEF0F6;--ink:#101A38;--muted:#5A6482;--line:#D6DBE8;--accent:#2E4A8E;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0E1427;--ink:#E6EAF6;--muted:#9AA5C6;--line:#2A3556;--accent:#8FAAF0;--surface:#161E38}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:0 16px 32px}
.tour{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:20px}
h1{font-size:clamp(20px,3.5vw,28px);margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.stage{position:relative;aspect-ratio:1200/860;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.015);transition:opacity .8s ease,transform 1.2s ease;pointer-events:none}
.slide.on{opacity:1;transform:none}
.slide .desk{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.slide .ph{position:absolute;right:3%;bottom:-8%;height:78%;border-radius:22px;border:6px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.28);transform:translateY(30px);opacity:0;transition:transform .9s .35s ease,opacity .9s .35s ease;background:#fff}
.slide.on .ph{transform:none;opacity:1}
.cap{min-height:3.2em}
.cap b{display:block;font-size:20px}.cap span{color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:8px;flex:1;min-width:140px}
.dots button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0;cursor:pointer;overflow:hidden;position:relative}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:fill var(--dur) linear forwards}
.dots button.done{background:var(--accent)}
.paused .dots button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.b:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.slide,.slide .ph{transition:none}.dots button.on::after{animation:none;transform:none}}
@media (max-width:560px){.slide .ph{height:70%}}
</style></head><body>
