<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theatre Booking and Outcome Tracking System</title>
<style>
:root{--bg:#EEF0F6;--ink:#101A38;--muted:#5A6482;--line:#D6DBE8;--accent:#2E4A8E;--surface:#fff;--ok:#1E7A4F}
@media (prefers-color-scheme:dark){:root{--bg:#0E1427;--ink:#E6EAF6;--muted:#9AA5C6;--line:#2A3556;--accent:#8FAAF0;--surface:#161E38;--ok:#5FD09A}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:0 16px 32px}
.g{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:20px}
h1{font-size:clamp(20px,3.5vw,28px);margin:0}.sub{color:var(--muted);margin:2px 0 0}
.stage{position:relative;height:min(78vh,620px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:minmax(0,1fr);gap:28px;align-items:center;padding:20px 28px;opacity:0;transform:translateX(24px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.slide.on{opacity:1;transform:none}
.slide img{height:100%;min-height:0;max-width:100%;width:auto;object-fit:contain;align-self:stretch;border-radius:14px;border:1px solid var(--line);display:block}
.n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:700;margin-bottom:10px}
.slide h2{margin:0 0 8px;font-size:clamp(22px,3vw,30px)}.slide p{margin:0;font-size:18px;color:var(--muted)}.slide p b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:8px;flex:1;min-width:140px}
.dots button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0;cursor:pointer;overflow:hidden;position:relative}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:fill var(--dur) linear forwards}
.dots button.done{background:var(--accent)}.paused .dots button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.b:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.dots button.on::after{animation:none;transform:none}}
@media (max-width:640px){.stage{height:auto;min-height:0}.slide{position:absolute;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:14px;gap:12px}.stage{height:min(88vh,640px)}.slide img{height:100%;max-height:none;margin:0 auto;object-fit:contain;max-width:100%}.slide>div{order:-1}.slide p{font-size:16px}}
</style></head><body><div class="g" id="g">
<div><h1>Opening the Theatre Booking and Outcome Tracking System for the first time</h1><p class="sub">Google asks you to approve the app once. Follow these screens until the diary opens.</p></div>
<div class="stage" id="stage"></div>
<div class="bar"><button class="b" id="prev" aria-label="Previous">&larr;</button><div class="dots" id="dots"></div><button class="b" id="play">Pause</button><button class="b" id="next" aria-label="Next">&rarr;</button></div>
<p class="note">Do not close the page before the last screen. A half-finished approval shows "No access".</p>
</div>
